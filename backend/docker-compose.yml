services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: slope
      POSTGRES_PASSWORD: slope_local_dev
      POSTGRES_DB: slope_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - slope-postgres-data:/var/lib/postgresql/data
      - ./scripts/create-test-db.sh:/docker-entrypoint-initdb.d/01-create-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slope -d slope_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  slope-postgres-data:
