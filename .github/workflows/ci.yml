name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Android 用にアプリをバンドルできるか（import の間違い・足りない依存を検出。端末やエミュレータは使わない）
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export"
      - name: 契約の変更に CHANGELOG の行があるか
        if: github.event_name == 'pull_request'
        run: node scripts/check-changelog.mjs --base origin/${{ github.base_ref }}
