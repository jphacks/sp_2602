name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: ビルド（client から server-only を読んでいない・"use client" の付け忘れ等を検出）
        run: npm run build
        env:
          MOCK: "1"
      - name: 範囲チェック（PR 作成者の所有範囲に収まっているか）
        if: github.event_name == 'pull_request'
        run: node scripts/check-scope.mjs --base origin/${{ github.base_ref }} --author ${{ github.event.pull_request.user.login }} --branch ${{ github.head_ref }}
